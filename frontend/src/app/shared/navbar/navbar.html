@if (auth.currentUser(); as user) {
  <header class="navbar" [class.scrolled]="scrolled()">
    <div class="navbar-inner">
      <a class="wordmark" routerLink="/dashboard">
        <app-logo class="mark" />
        CalTrack
      </a>

      <nav class="links" aria-label="Main">
        <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
        <a routerLink="/predict" routerLinkActive="active" ariaCurrentWhenActive="page">Log workout</a>
        <a routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">History</a>
        <a routerLink="/premium" routerLinkActive="active" ariaCurrentWhenActive="page">Premium</a>
        <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profile</a>
      </nav>

      <div class="account">
        <app-plan-badge [user]="user" />
        <span class="avatar" aria-hidden="true">{{ user.name.charAt(0) }}</span>
        <span class="name" [attr.title]="user.name">{{ user.name }}</span>
        <button class="logout" type="button" (click)="logout()">Log out</button>
      </div>
    </div>
  </header>
}
