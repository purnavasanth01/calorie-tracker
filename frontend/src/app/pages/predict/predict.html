<div class="page-container narrow">
  <h1>Log a Workout</h1>
  <p>Enter your session details and we'll predict the calories burnt.</p>

  @if (result(); as r) {
    <div class="card result-card">
      <span class="result-label">Estimated Calories Burnt</span>
      <div class="result-value">{{ r.caloriesBurnt }} <span>kcal</span></div>
      <button class="btn btn-outline" (click)="logAnother()">Log another workout</button>
    </div>
  } @else {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid">
        <div class="field">
          <label class="field-label">Gender</label>
          <select class="input" formControlName="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label">Age (years)</label>
          <input
            class="input"
            type="number"
            formControlName="age"
            [class.input-invalid]="form.controls.age.invalid && form.controls.age.touched"
          />
        </div>

        <div class="field">
          <label class="field-label">Height (cm)</label>
          <input
            class="input"
            type="number"
            formControlName="height"
            [class.input-invalid]="form.controls.height.invalid && form.controls.height.touched"
          />
        </div>

        <div class="field">
          <label class="field-label">Weight (kg)</label>
          <input
            class="input"
            type="number"
            formControlName="weight"
            [class.input-invalid]="form.controls.weight.invalid && form.controls.weight.touched"
          />
        </div>

        <div class="field">
          <label class="field-label">Duration (minutes)</label>
          <input
            class="input"
            type="number"
            formControlName="duration"
            [class.input-invalid]="form.controls.duration.invalid && form.controls.duration.touched"
          />
        </div>

        <div class="field">
          <label class="field-label">Heart Rate (bpm)</label>
          <input
            class="input"
            type="number"
            formControlName="heartRate"
            [class.input-invalid]="form.controls.heartRate.invalid && form.controls.heartRate.touched"
          />
        </div>

        <div class="field">
          <label class="field-label">Body Temp (°C)</label>
          <input
            class="input"
            type="number"
            step="0.1"
            formControlName="bodyTemp"
            [class.input-invalid]="form.controls.bodyTemp.invalid && form.controls.bodyTemp.touched"
          />
        </div>
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Predicting...' : 'Predict Calories Burnt' }}
      </button>
    </form>
  }
</div>
