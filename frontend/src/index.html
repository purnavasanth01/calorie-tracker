<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CalTrack</title>
  <meta name="description" content="Log your workouts and get machine-learning predictions of the calories you burned.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3b2d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .boot { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #fbf8f2; }
    .boot span { display: flex; align-items: center; gap: 12px; font: 600 1.6rem 'Cormorant Garamond', Georgia, serif; color: #22201c; }
    .boot svg { width: 36px; height: 36px; fill: none; stroke: #b8955a; stroke-width: 1.4; stroke-linejoin: round; animation: boot-pulse 1.6s ease-in-out infinite; }
    @keyframes boot-pulse { 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot" role="status" aria-label="Loading CalTrack">
      <span>
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" />
          <path d="M16 6.5c.9 4.2 6 6.6 6 12.4a6 6 0 0 1-12 0c0-2.7 1.3-4.4 2.9-5.7.3 2 1.2 3.2 2.4 3.7-.6-3.7-.3-7.5.7-10.4z" />
        </svg>
        CalTrack
      </span>
    </div>
  </app-root>
</body>
</html>
